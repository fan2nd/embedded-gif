[package]
name = "embedded-gif-macros"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural macros for embedded-gif."

[lib]
proc-macro = true

[dependencies]
gif = "0.13"
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["parsing"] }
