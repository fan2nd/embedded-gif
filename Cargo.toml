[workspace]
members = [
    "embedded-gif",
    "embedded-gif-macros",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/embedded-gif"

[workspace.dependencies]
embedded-graphics = { version = "0.8", default-features = false }
embedded-gif-macros = { path = "embedded-gif-macros" }
